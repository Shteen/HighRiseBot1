name: Run Highrise Bot

on:
  workflow_dispatch: # Allows manual start from Actions tab
  schedule:
    - cron: '0 */5 * * *' # Auto-restarts every 5 hours (GitHub jobs cap at 6h)

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Bot
        env:
          ROOM_ID: ${{ secrets.ROOM_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python main.py
